[versions]
agp = "9.4.0"
kotlin = "2.2.10"
ksp = "2.3.12"
media3 = "1.11.1"
room = "2.8.5"
coroutines = "1.10.2"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[libraries]
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite = { module = "androidx.sqlite:sqlite", version = "2.5.2" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
activity = { module = "androidx.activity:activity-ktx", version = "1.10.1" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.9.4" }
junit = { module = "junit:junit", version = "4.13.2" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
